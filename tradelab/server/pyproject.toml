[project]
name = "tradelab-server"
version = "0.2.5"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
