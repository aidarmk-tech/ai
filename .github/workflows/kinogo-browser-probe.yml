name: Check KinoGo browser players
on:
  push:
    branches: [codex/kinogo-browser-probe]
    paths: ['scripts/kinogo-browser-probe.py', '.github/workflows/kinogo-browser-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - name: Inspect selected KinoKong player
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/kinogo-browser-probe.py
