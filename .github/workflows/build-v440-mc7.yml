name: Build PumpRadar v4.4.0 MC7

on:
  push:
    branches:
      - chatgpt/pumpradar-v440-mc7-freeze100

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v4.4.0 source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config = Path('pumpradar-server/pumpradar_server/config.py')
          text = config.read_text()
          text = text.replace('algorithm_version: str = "4.3.9-server"', 'algorithm_version: str = "4.4.0-server"')
          text = text.replace(
              'strategy_version: str = "TRADE3-QUALITY+TARGET1-HOLD+MC5-HOLD120-2026-07"',
              'strategy_version: str = "TRADE3-QUALITY+TARGET1-HOLD+MC5-MC7-HOLD120-FROZEN100-2026-07"',
          )
          text = text.replace(
              '    momentum_primary_policy: str = "MC_HOLD_120"\n',
              '    momentum_primary_policy: str = "MC_HOLD_120"\n'
              '    freeze_primary_trade_target: int = 100\n',
          )
          config.write_text(text)

          init = Path('pumpradar-server/pumpradar_server/__init__.py')
          init_text = init.read_text().replace('4.3.9', '4.4.0')
          init.write_text(init_text)

          main = Path('pumpradar-server/pumpradar_server/main.py')
          text = main.read_text()
          text = text.replace('        now = int(time.time() * 1000)\n        return {', '        now = int(time.time() * 1000)\n        progress = self.storage.frozen_primary_trade_progress()\n        return {', 1)
          text = text.replace(
              '            "uptime_seconds": (now - self.started_at_ms) // 1000,\n',
              '            "uptime_seconds": (now - self.started_at_ms) // 1000,\n'
              '            "freeze_closed_primary_trades": progress["closed"],\n'
              '            "freeze_target_primary_trades": progress["target"],\n'
              '            "freeze_remaining_primary_trades": progress["remaining"],\n',
              1,
          )
          text = text.replace('                "MC7": "MC7_SHADOW",', '                "MC7": "MC7_CHALLENGER",')
          text = text.replace('            if arm == "MC5":', '            if arm in ("MC5", "MC7"):')
          old_call = '''                await self.momentum.consider(
                    item,
                    sid,
                    now_ms,
                    telemetry.episode_id,
                )'''
          new_call = '''                await self.momentum.consider(
                    item,
                    sid,
                    now_ms,
                    telemetry.episode_id,
                    channel=arm,
                )'''
          if old_call not in text:
              raise SystemExit('momentum consider call not found')
          text = text.replace(old_call, new_call, 1)
          main.write_text(text)

          paper = Path('pumpradar-server/pumpradar_server/paper.py')
          text = paper.read_text()
          head, sep, tail = text.partition('class MomentumPaperManager:')
          if not sep:
              raise SystemExit('MomentumPaperManager not found')
          tail = tail.replace(
              '    """Independent MC5 one-slot paper challenger.\n\n'
              '    The frozen TRADE3 slot remains untouched.  This manager owns a separate\n'
              '    sequential slot and evaluates both the primary trailing policy and a fixed\n'
              '    +4%/-2% control on the same executable entry.\n'
              '    """',
              '    """Shared-risk MC5/MC7 momentum paper channel.\n\n'
              '    MC5 and MC7 are independent signal channels, but deliberately share one\n'
              '    sequential execution slot so the upgrade cannot double correlated exposure.\n'
              '    Each entry retains its source snapshot type for channel-level analysis.\n'
              '    """',
              1,
          )
          tail = tail.replace(
              '        episode_id: str,\n    ) -> None:',
              '        episode_id: str,\n        channel: str = "MC5",\n    ) -> None:',
              1,
          )
          tail = tail.replace('"MC5_SLOT_BUSY"', 'f"{channel}_SLOT_BUSY"')
          tail = tail.replace('"MC5_REPEAT_SYMBOL_20M"', 'f"{channel}_REPEAT_SYMBOL_20M"')
          tail = tail.replace('"MC5_NO_EXECUTABLE_ENTRY"', 'f"{channel}_NO_EXECUTABLE_ENTRY"')
          tail = tail.replace(
              '        slot_id = self.storage.create_momentum_slot(',
              '        signal_return = (\n'
              '            item.candidate.return_5m\n'
              '            if channel == "MC5"\n'
              '            else item.candidate.return_10m\n'
              '        )\n'
              '        signal_window = "5m" if channel == "MC5" else "10m"\n'
              '        slot_id = self.storage.create_momentum_slot(',
              1,
          )
          tail = tail.replace(
              '            f"🔵 PumpRadar MC5 challenger\\n{item.candidate.symbol}\\n"\n'
              '            f"return5m {item.candidate.return_5m:+.3f}% · entry {item.book.buy_vwap:.8g}\\n"',
              '            f"🔵 PumpRadar {channel} challenger\\n{item.candidate.symbol}\\n"\n'
              '            f"return{signal_window} {float(signal_return or 0):+.3f}% · entry {item.book.buy_vwap:.8g}\\n"',
              1,
          )
          tail = tail.replace(
              '        LOG.info("Opened momentum slot %s %s", slot_id, item.candidate.symbol)',
              '        LOG.info("Opened momentum slot %s %s channel=%s", slot_id, item.candidate.symbol, channel)',
              1,
          )
          tail = tail.replace(
              '                f"🔷 {slot[\'symbol\']} MC5 {exit_reason}: net {net:+.3f}%"',
              '                f"🔷 {slot[\'symbol\']} momentum {exit_reason}: net {net:+.3f}%"',
              1,
          )
          paper.write_text(head + sep + tail)

          storage = Path('pumpradar-server/pumpradar_server/storage.py')
          text = storage.read_text()
          marker = '    def frozen_primary_trade_progress(self) -> dict[str, int]:'
          if marker not in text:
              text += '''\n\n    def frozen_primary_trade_progress(self) -> dict[str, int]:
        """Count closed primary paper trades for the current frozen version."""
        with self.lock:
            trade3 = int(self.conn.execute(
                "SELECT COUNT(*) FROM paper_slots "
                "WHERE baseline_status='CLOSED' AND algorithm_version=?",
                (self.settings.algorithm_version,),
            ).fetchone()[0])
            momentum = int(self.conn.execute(
                "SELECT COUNT(*) FROM momentum_slots "
                "WHERE primary_status='CLOSED' AND algorithm_version=?",
                (self.settings.algorithm_version,),
            ).fetchone()[0])
        closed = trade3 + momentum
        target = int(self.settings.freeze_primary_trade_target)
        return {
            "closed": closed,
            "target": target,
            "remaining": max(0, target - closed),
        }
'''
          storage.write_text(text)

          readme = Path('pumpradar-server/README.md')
          readme.write_text(readme.read_text() + '''\n\n## v4.4.0 frozen experiment\n\n- MC5 remains unchanged.\n- MC7 is promoted from shadow to a second momentum signal channel.\n- MC5 and MC7 share one momentum execution slot to avoid doubled correlated exposure.\n- TRADE3 thresholds, TBR gates, stop logic, and MC_HOLD_120 remain unchanged.\n- No strategy upgrade is allowed until 100 primary paper trades close under 4.4.0.\n- Real orders remain disabled.\n''')
          PY

      - name: Validate source
        run: |
          python3 -m pip install --disable-pip-version-check -q pytest -r pumpradar-server/requirements.txt
          python3 -m compileall -q pumpradar-server/pumpradar_server
          pytest -q pumpradar-server/tests
          python3 - <<'PY'
          from pathlib import Path
          main = Path('pumpradar-server/pumpradar_server/main.py').read_text()
          paper = Path('pumpradar-server/pumpradar_server/paper.py').read_text()
          config = Path('pumpradar-server/pumpradar_server/config.py').read_text()
          assert '"MC7": "MC7_CHALLENGER"' in main
          assert 'if arm in ("MC5", "MC7"):' in main
          assert 'channel=arm' in main
          assert 'channel: str = "MC5"' in paper
          assert '4.4.0-server' in config
          assert 'freeze_primary_trade_target: int = 100' in config
          PY

      - name: Build verified payload and installer
        run: |
          rm -rf server-bootstrap/v440 server-bootstrap/v440release
          mkdir -p server-bootstrap/v440 server-bootstrap/v440release
          printf '%s\n' '4.4.0-server' > server-bootstrap/v440/EXPECTED_VERSION
          printf '%s\n' 'PAPER_ONLY' > server-bootstrap/v440/PAPER_ONLY
          printf '%s\n' 'NO_REAL_ORDERS' > server-bootstrap/v440/NO_REAL_ORDERS
          cat > server-bootstrap/v440/CHANGESET <<'EOF'
          MC7 promoted from shadow to paper challenger.
          MC5 and MC7 share one momentum risk slot.
          TRADE3 and MC5 entry/exit thresholds unchanged.
          Frozen until 100 closed primary paper trades.
          EOF
          cat > server-bootstrap/v440/README.md <<'EOF'
          PumpRadar v4.4.0 is a paper-only frozen experiment.
          The sole trading change is MC7 activation as a second momentum signal channel.
          No additional strategy changes should be made before 100 closed primary trades.
          EOF
          cat > server-bootstrap/v440/INSTALL_COMMAND.txt <<'EOF'
          curl -fsSL https://raw.githubusercontent.com/aidarmk-tech/ai/chatgpt/pumpradar-v440-mc7-freeze100/server-bootstrap/install-v440-safe.sh | bash
          EOF

          tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/pumpradar-v440.tar.gz pumpradar-server
          sha="$(sha256sum /tmp/pumpradar-v440.tar.gz | awk '{print $1}')"
          base64 -w0 /tmp/pumpradar-v440.tar.gz > /tmp/payload.b64
          split -n l/4 -d -a 2 /tmp/payload.b64 server-bootstrap/v440release/

          python3 - "$sha" <<'PY'
          from pathlib import Path
          import re, sys
          sha = sys.argv[1]
          path = Path('server-bootstrap/install.sh')
          text = path.read_text()
          text = re.sub(r'^REPO_RAW=.*$', 'REPO_RAW="https://raw.githubusercontent.com/aidarmk-tech/ai/chatgpt/pumpradar-v440-mc7-freeze100/server-bootstrap"', text, flags=re.M)
          text = re.sub(r'^PAYLOAD_PATH=.*$', 'PAYLOAD_PATH="v440release"', text, flags=re.M)
          text = re.sub(r'^PAYLOAD_SHA256=.*$', f'PAYLOAD_SHA256="{sha}"', text, flags=re.M)
          text = re.sub(r'^EXPECTED_VERSION=.*$', 'EXPECTED_VERSION="4.4.0-server"', text, flags=re.M)
          text = text.replace("grep -q '4.3.9-server'", "grep -q '4.4.0-server'")
          path.write_text(text)

          safe = Path('server-bootstrap/install-v439-safe.sh').read_text()
          safe = safe.replace('chatgpt/pumpradar-v439-profit', 'chatgpt/pumpradar-v440-mc7-freeze100')
          safe = safe.replace('v4.3.9', 'v4.4.0')
          Path('server-bootstrap/install-v440-safe.sh').write_text(safe)
          PY
          chmod +x server-bootstrap/install.sh server-bootstrap/install-v440-safe.sh
          printf 'payload_sha256=%s\n' "$sha" > server-bootstrap/v440/LOCAL_VALIDATION.md

      - name: Commit generated v4.4.0
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pumpradar-server server-bootstrap
          git commit -m 'PumpRadar v4.4.0: activate MC7 paper channel [skip ci]'
          git push
