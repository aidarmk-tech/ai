name: Test PumpRadar Server

on:
  push:
    branches:
      - chatgpt/pumpradar-server-v43
    paths:
      - 'pumpradar-server/**'
      - 'server-bootstrap/**'
      - '.github/workflows/test-pumpradar-server.yml'
  pull_request:
    paths:
      - 'pumpradar-server/**'
      - 'server-bootstrap/**'
      - '.github/workflows/test-pumpradar-server.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v4.3.8 payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cat server-bootstrap/v438payload/{00..03} > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          echo 'f6554bb8b0da08869d465d54ebb946f98487fb72a5434abe5770b437b09edafe  /tmp/payload.tar.gz' | sha256sum -c -
          tar -tzf /tmp/payload.tar.gz >/dev/null
          mkdir /tmp/pumpradar
          tar -xzf /tmp/payload.tar.gz -C /tmp/pumpradar --strip-components=1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r /tmp/pumpradar/requirements.txt

      - name: Verify server and installer
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q /tmp/pumpradar/pumpradar_server
          bash -n server-bootstrap/install.sh
          bash -n server-bootstrap/enable-client.sh
          bash -n server-bootstrap/update-v431.sh
          bash -n /tmp/pumpradar/scripts/*.sh
          PYTHONPATH=/tmp/pumpradar python -m unittest discover -s /tmp/pumpradar/tests -v
          PYTHONPATH=/tmp/pumpradar python - <<'PY'
          from pumpradar_server.config import Settings

          settings = Settings()
          assert settings.algorithm_version == '4.3.8-server'
          assert settings.strategy_version == 'TRADE3-FROZEN+MC5-CHALLENGER-2026-07'
          assert settings.primary_policy == 'C_WEAKENING'
          assert settings.minimum_24h_quote_volume == 1_000_000.0
          assert settings.max_candidates == 30
          assert settings.warm_pool_size == 60
          assert settings.deep_candidates == 20
          assert settings.depth_candidates == 25

          # Frozen TRADE3 control remains unchanged.
          assert settings.min_taker_buy_ratio_30s == 0.875
          assert settings.min_trade3_impulse_score == 63
          assert settings.min_trade3_taker_buy_ratio_15s == 0.90
          assert settings.min_trade3_taker_buy_ratio_5s == 0.75
          assert settings.max_trade3_exhaustion_risk == 0
          assert settings.max_trade3_artificial_risk == 0
          assert settings.protected_stop_percent == 0.30
          assert settings.protected_peak_fraction == 0.50

          # Frozen Momentum Continuation challenger.
          assert settings.momentum_mc3_return_3m == 3.0
          assert settings.momentum_mc5_return_5m == 5.0
          assert settings.momentum_mc7_return_10m == 7.0
          assert settings.momentum_stop_percent == 2.0
          assert settings.momentum_trail_activation_percent == 1.5
          assert settings.momentum_trail_drawdown_percent == 1.0
          assert settings.momentum_horizon_seconds == 20 * 60
          assert settings.momentum_fixed_target_percent == 4.0
          print('smoke ok', settings.algorithm_version, settings.config_hash())
          PY

      - name: Migration smoke test
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=/tmp/pumpradar python - <<'PY'
          import sqlite3
          import tempfile
          from dataclasses import replace
          from pathlib import Path
          from pumpradar_server.config import Settings
          from pumpradar_server.storage import Storage

          root = Path(tempfile.mkdtemp())
          db = root / 'pumpradar.sqlite3'
          conn = sqlite3.connect(db)
          conn.executescript('''
          PRAGMA journal_mode=WAL;
          CREATE TABLE experiment_runs (
            id TEXT PRIMARY KEY, started_at_ms INTEGER NOT NULL, ended_at_ms INTEGER,
            algorithm_version TEXT NOT NULL, strategy_version TEXT NOT NULL,
            config_hash TEXT NOT NULL, host TEXT, status TEXT NOT NULL
          );
          ''')
          conn.commit()
          conn.close()
          settings = replace(Settings(), data_dir=root, db_path=db)
          storage = Storage(settings)
          assert storage.conn.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert storage.conn.execute("SELECT name FROM sqlite_master WHERE name='momentum_slots'").fetchone()
          assert storage.conn.execute("SELECT name FROM sqlite_master WHERE name='momentum_policy_runs'").fetchone()
          assert not list(storage.conn.execute('PRAGMA foreign_key_check'))
          storage.conn.close()
          print('migration smoke ok')
          PY

      - name: Upload verified server source
        uses: actions/upload-artifact@v4
        with:
          name: pumpradar-server-source-v438
          path: /tmp/pumpradar
          if-no-files-found: error
          retention-days: 7
