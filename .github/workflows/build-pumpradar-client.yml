name: Build PumpRadar Server Client

on:
  push:
    branches:
      - chatgpt/pumpradar-server-v43
    paths:
      - 'pumpradar-client/**'
      - '.github/workflows/build-pumpradar-client.yml'
  pull_request:
    paths:
      - 'pumpradar-client/**'
      - '.github/workflows/build-pumpradar-client.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          gradle -p pumpradar-client --no-daemon assembleDebug 2>&1 | tee out/build.log

      - name: Preserve diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p out
          test -f out/build.log || echo 'build.log was not created' > out/build.log
          tail -n 120 out/build.log > out/build-tail.log
          find out -maxdepth 1 -type f -printf '%f %s bytes\n' || true

      - name: Stage APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          cp pumpradar-client/app/build/outputs/apk/debug/app-debug.apk out/PumpRadar-Server-Client.apk
          sha256sum out/PumpRadar-Server-Client.apk | tee out/SHA256SUMS.txt

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PumpRadar-Server-Client-${{ github.run_id }}
          path: ${{ github.workspace }}/out
          if-no-files-found: warn
          retention-days: 30

      - name: Fail when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
