name: Build PumpRadar Server Client

on:
  workflow_dispatch:
  push:
    branches:
      - agent/pumpradar-client-v140-l2-vex
    paths:
      - 'pumpradar-client/**'
      - '.github/workflows/build-pumpradar-client.yml'
  pull_request:
    paths:
      - 'pumpradar-client/**'
      - '.github/workflows/build-pumpradar-client.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply and verify 1.4.0 research lab patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/pumpradar-client"
          python3 apply-v131-hotfix.py
          python3 apply-v132-hotfix.py
          python3 apply-v140-l2-vex.py
          grep -F 'CLIENT_VERSION = "1.4.0"' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'EXPORT_READ_TIMEOUT_MS = 300_000' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'MANIFEST_POLL_TIMEOUT_MS = 600_000L' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'mayBeExportGatewayTimeout' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'research_vex_portfolios' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'research_l2_state_current' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'research_h05_challenger' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java
          grep -F 'GZIPInputStream' app/src/main/java/com/aidar/pumpradar/client/MainActivity.java

      - name: Build standalone client APK
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          cd "$GITHUB_WORKSPACE/pumpradar-client"
          gradle --no-daemon assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/out/build.log"

      - name: Stage APK
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="$GITHUB_WORKSPACE/pumpradar-client/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/PumpRadar-Server-Client-v1.4.0.apk"
          sha256sum "$GITHUB_WORKSPACE/out/PumpRadar-Server-Client-v1.4.0.apk" | tee "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PumpRadar-Server-Client-v1.4.0-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30
