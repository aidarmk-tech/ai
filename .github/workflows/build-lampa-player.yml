name: Build Lampa Player APK

on:
  push:
    branches: [ "claude/code-from-spec-tE7mA", "claude/lampplayer-android-tv-BNB6g", "main", "master" ]
    paths:
      - "lampa-player-native/**"
      - "lmnp.js"
      - ".github/workflows/build-lampa-player.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # Prefer the keystore from secrets (KEYSTORE_B64 = base64 of lampplayer.jks);
      # fall back to the repo copy until the secret is configured.
      - name: Restore signing keystore
        run: |
          mkdir -p lampa-player-native/keystore
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > lampa-player-native/keystore/lampplayer.jks
            echo "Using keystore from secrets"
          elif [ -f lampa-player-native/keystore/lampplayer.jks ]; then
            echo "Using keystore from repo (add KEYSTORE_B64 secret to remove it)"
          else
            echo "No keystore available" && exit 1
          fi

      - name: Test and build update APK
        working-directory: lampa-player-native
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace -PlampCorePreview=false -PverCode=${{ github.run_number }} -PverName=1.0.${{ github.run_number }}

      - name: Verify update package, version and signing certificate
        if: github.ref == 'refs/heads/main'
        env:
          UPDATE_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=lampa-player-native/app/build/outputs/apk/debug/app-debug.apk
          identity=$("$build_tools/aapt" dump badging "$apk" | sed -n '1p')
          python - "$identity" "$UPDATE_CODE" <<'PY'
          import re, sys
          fields = dict(re.findall(r"(\w+)='([^']*)'", sys.argv[1]))
          assert fields.get('name') == 'com.lampplayer.tv', fields
          assert int(fields['versionCode']) == int(sys.argv[2]), fields
          print('Update package:', fields['name'], fields['versionName'])
          PY
          mkdir -p previous-update
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 60 \
            https://github.com/${{ github.repository }}/releases/download/auto/version.json \
            -o previous-update/version.json
          previous_url=$(python - "$UPDATE_CODE" <<'PY'
          import json, sys
          with open('previous-update/version.json') as f:
              previous = json.load(f)
          assert int(sys.argv[1]) > int(previous['versionCode']), 'Update version must increase'
          url = previous['url']
          assert url.startswith('https://github.com/${{ github.repository }}/releases/download/auto/'), 'Unexpected previous APK URL'
          print(url)
          PY
          )
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120 "$previous_url" -o previous-update/app.apk
          python - <<'PY'
          import hashlib, json
          with open('previous-update/version.json') as f:
              expected = json.load(f)['sha256']
          with open('previous-update/app.apk', 'rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          assert actual == expected, 'Previous APK checksum mismatch'
          PY
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > previous-update/new-certificate.txt
          "$build_tools/apksigner" verify --verbose --print-certs previous-update/app.apk > previous-update/old-certificate.txt
          python - <<'PY_CERT'
          import pathlib, re
          def digests(path):
              output = pathlib.Path(path).read_text()
              result = set(re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})', output))
              if not result:
                  print(output)
                  raise RuntimeError('apksigner did not provide a signer certificate digest')
              return {item.lower() for item in result}
          new = digests('previous-update/new-certificate.txt')
          old = digests('previous-update/old-certificate.txt')
          print('New signer SHA256:', ', '.join(sorted(new)))
          print('Previous signer SHA256:', ', '.join(sorted(old)))
          assert new == old, 'Signing certificate differs from the installed release'
          print('Signing certificate matches the existing LampPlayer release')
          PY_CERT

      - name: Upload signing diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LampPlayer-signing-diagnostics-${{ github.run_number }}
          path: |
            lampa-player-native/app/build/outputs/apk/debug/app-debug.apk
            previous-update/*certificate.txt
          retention-days: 3

      - name: Stage APK
        run: |
          mkdir -p dist
          # Immutable per-build name for the auto-updater (a reused URL lets GitHub's
          # CDN serve stale bytes after re-upload → sha256 mismatch → "не прошёл проверку").
          cp lampa-player-native/app/build/outputs/apk/debug/app-debug.apk dist/LampPlayer-${{ github.run_number }}.apk
          # Stable alias for manual installs.
          cp dist/LampPlayer-${{ github.run_number }}.apk dist/LampPlayer.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LampaPlayer-debug-${{ github.run_number }}
          path: dist/LampPlayer.apk
          retention-days: 30

      # ── Auto-update publishing (main only): APK + version.json as release assets ──
      - name: Write version.json
        if: github.ref == 'refs/heads/main'
        run: |
          SHA256=$(sha256sum dist/LampPlayer-${{ github.run_number }}.apk | cut -d' ' -f1)
          cat > dist/version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/auto/LampPlayer-${{ github.run_number }}.apk",
            "sha256": "$SHA256",
            "notes": "Обновление #${{ github.run_number }}: LampCore: восстановление HLS, автокачество, выбор звука и сведение 5.1/7.1, текстовые субтитры с размером и синхронизацией. Выбор движка: Настройки → LampCore."
          }
          EOF
          cat dist/version.json

      - name: Publish rolling release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto
          name: LampPlayer (auto)
          body: "Rolling auto-update build #${{ github.run_number }}"
          files: |
            dist/LampPlayer-${{ github.run_number }}.apk
            dist/LampPlayer.apk
            dist/version.json

      # Delete previous per-build APKs so the 'auto' release doesn't grow unbounded.
      # Runs AFTER publish, so the new versioned APK is already uploaded before we prune.
      - name: Prune old APK assets (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep="LampPlayer-${{ github.run_number }}.apk"
          ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/auto" \
                  --jq ".assets[] | select(.name|test(\"^LampPlayer-[0-9]+\\\\.apk$\")) | select(.name != \"$keep\") | .id" 2>/dev/null || true)
          for id in $ids; do
            echo "deleting old apk asset id=$id"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" || true
          done
