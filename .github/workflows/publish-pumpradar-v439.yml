name: Publish PumpRadar v4.3.9

on:
  pull_request:
    branches:
      - chatgpt/pumpradar-server-v43
    paths:
      - '.github/workflows/publish-pumpradar-v439.yml'
      - 'server-bootstrap/v439/source.patch.gz.b64'

permissions:
  contents: write

jobs:
  verify-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct reviewed v4.3.9 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8669359895/zip" \
            -o /tmp/v438-source.zip
          rm -rf /tmp/pumpradar
          mkdir -p /tmp/pumpradar
          unzip -q /tmp/v438-source.zip -d /tmp/pumpradar
          grep -q '4.3.8-server' /tmp/pumpradar/pumpradar_server/config.py
          base64 --decode server-bootstrap/v439/source.patch.gz.b64 > /tmp/v439.patch.gz
          gzip -t /tmp/v439.patch.gz
          gzip -dc /tmp/v439.patch.gz > /tmp/v439.patch
          cd /tmp/pumpradar
          patch --batch --forward -p1 < /tmp/v439.patch
          grep -q '4.3.9-server' pumpradar_server/config.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test and migrate
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r /tmp/pumpradar/requirements.txt
          python -m compileall -q /tmp/pumpradar/pumpradar_server /tmp/pumpradar/tests
          PYTHONPATH=/tmp/pumpradar python -m unittest discover -s /tmp/pumpradar/tests -v
          PYTHONPATH=/tmp/pumpradar python - <<'PY'
          import sqlite3
          import tempfile
          from dataclasses import replace
          from pathlib import Path
          from pumpradar_server.config import Settings
          from pumpradar_server.storage import Storage
          root = Path(tempfile.mkdtemp())
          db = root / 'pumpradar.sqlite3'
          sqlite3.connect(db).close()
          settings = replace(Settings(), data_dir=root, db_path=db, api_token='test')
          storage = Storage(settings)
          assert settings.algorithm_version == '4.3.9-server'
          assert settings.momentum_primary_policy == 'MC_HOLD_120'
          assert settings.trade3_target1_hold_seconds == 300
          assert settings.stop_watch_interval_ms == 500
          assert storage.conn.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          assert not list(storage.conn.execute('PRAGMA foreign_key_check'))
          columns = {row['name'] for row in storage.conn.execute('PRAGMA table_info(snapshot_outcomes)')}
          assert {'return_90s', 'return_150s', 'return_180s', 'return_240s'} <= columns
          storage.conn.close()
          print('v4.3.9 migration smoke ok')
          PY

      - name: Build deterministic payload
        shell: bash
        run: |
          set -Eeuo pipefail
          find /tmp/pumpradar -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf /tmp/pumpradar-server
          cp -a /tmp/pumpradar /tmp/pumpradar-server
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -czf /tmp/pumpradar-v439.tar.gz -C /tmp pumpradar-server
          base64 -w 0 /tmp/pumpradar-v439.tar.gz > /tmp/pumpradar-v439.tar.gz.b64
          sha256sum /tmp/pumpradar-v439.tar.gz

      - name: Publish source, payload and installer
        shell: bash
        env:
          TARGET_BRANCH: chatgpt/pumpradar-v439-profit
        run: |
          set -Eeuo pipefail
          rm -rf pumpradar-server
          mkdir -p pumpradar-server
          cp -a /tmp/pumpradar/. pumpradar-server/
          RELEASE_DIR=server-bootstrap/v439release
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          split -b 14000 -d -a 2 /tmp/pumpradar-v439.tar.gz.b64 "$RELEASE_DIR/"
          mapfile -t PARTS < <(find "$RELEASE_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          [[ "${PARTS[*]}" == '00 01 02 03' ]]
          HASH="$(sha256sum /tmp/pumpradar-v439.tar.gz | awk '{print $1}')"
          python3 - "$HASH" <<'PY'
          import re
          import sys
          from pathlib import Path
          path = Path('server-bootstrap/install.sh')
          text = path.read_text()
          text = re.sub(r'^REPO_RAW=.*$', 'REPO_RAW="https://raw.githubusercontent.com/aidarmk-tech/ai/chatgpt/pumpradar-v439-profit/server-bootstrap"', text, flags=re.M)
          text = re.sub(r'^PAYLOAD_PATH=.*$', 'PAYLOAD_PATH="v439release"', text, flags=re.M)
          text = re.sub(r'^PAYLOAD_PARTS=.*$', 'PAYLOAD_PARTS=(00 01 02 03)', text, flags=re.M)
          text = re.sub(r'^PAYLOAD_SHA256=.*$', f'PAYLOAD_SHA256="{sys.argv[1]}"', text, flags=re.M)
          text = re.sub(r'^EXPECTED_VERSION=.*$', 'EXPECTED_VERSION="4.3.9-server"', text, flags=re.M)
          text = text.replace("grep -q '4.3.8-server'", "grep -q '4.3.9-server'")
          marker = 'ensure_env PUMPRADAR_REPORT_TIMEZONE_OFFSET_MINUTES 300\n'
          if 'ensure_env PUMPRADAR_STOP_WATCH_INTERVAL_MS 500' not in text:
              text = text.replace(marker, marker + 'ensure_env PUMPRADAR_STOP_WATCH_INTERVAL_MS 500\n')
          path.write_text(text)
          PY
          cat "$RELEASE_DIR"/{00..03} > /tmp/release.b64
          base64 --decode /tmp/release.b64 > /tmp/release.tar.gz
          echo "$HASH  /tmp/release.tar.gz" | sha256sum -c -
          tar -tzf /tmp/release.tar.gz >/dev/null
          grep -q '4.3.9-server' /tmp/pumpradar/pumpradar_server/config.py
          bash -n server-bootstrap/install.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pumpradar-server "$RELEASE_DIR" server-bootstrap/install.sh
          if git diff --cached --quiet; then
            echo 'v4.3.9 already published'
            exit 0
          fi
          git commit -m 'Publish PumpRadar v4.3.9 profit challengers'
          git push origin "HEAD:${TARGET_BRANCH}"
