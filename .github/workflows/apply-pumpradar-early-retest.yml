name: Build PumpRadar Early/Retest

on:
  push:
    branches: [ "chatgpt/pumpradar-early-retest-v1" ]
    paths:
      - "pumpradar/**"
      - ".github/workflows/apply-pumpradar-early-retest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pumpradar-early-retest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: pumpradar
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: pumpradar
        run: gradle assembleDebug --no-daemon --stacktrace -PverCode=${{ github.run_number }} -PverName=1.1.${{ github.run_number }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp pumpradar/app/build/outputs/apk/debug/app-debug.apk dist/PumpRadar-early-retest.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpRadar-early-retest-${{ github.run_number }}
          path: dist/PumpRadar-early-retest.apk
          retention-days: 30
