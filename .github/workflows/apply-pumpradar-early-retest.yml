name: Apply PumpRadar Early/Retest Improvements

on:
  push:
    branches: [ "chatgpt/pumpradar-early-retest-v1" ]
    paths:
      - "pumpradar/tools/apply_early_retest_patch.py"
      - ".github/workflows/apply-pumpradar-early-retest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout improvement branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/pumpradar-early-retest-v1
          fetch-depth: 0

      - name: Apply deterministic source patch
        run: python3 pumpradar/tools/apply_early_retest_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        working-directory: pumpradar
        run: gradle test --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: pumpradar
        run: gradle assembleDebug --no-daemon --stacktrace -PverCode=${{ github.run_number }} -PverName=1.1.${{ github.run_number }}

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pumpradar/app/src/main pumpradar/app/src/test
          git diff --cached --quiet && exit 0
          git commit -m "Improve early-pump and pre-high retest signals"
          git push origin HEAD:chatgpt/pumpradar-early-retest-v1

      - name: Stage APK
        run: |
          mkdir -p dist
          cp pumpradar/app/build/outputs/apk/debug/app-debug.apk dist/PumpRadar-early-retest.apk
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpRadar-early-retest-${{ github.run_number }}
          path: dist/PumpRadar-early-retest.apk
          retention-days: 30
