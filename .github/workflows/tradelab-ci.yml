name: TradeLab CI

on:
  push:
    branches: [tradelab-v0.1]
    paths:
      - 'tradelab/**'
      - '.github/workflows/tradelab-ci.yml'
  pull_request:
    paths:
      - 'tradelab/**'
      - '.github/workflows/tradelab-ci.yml'

concurrency:
  group: tradelab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradelab/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall tradelab

  deploy-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n tradelab/deploy/bootstrap-ip.sh
      - run: bash -n tradelab/deploy/update-server.sh

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tradelab/android-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tradelab-client-debug
          path: tradelab/android-client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
