name: Validate and publish PumpRadar v4.4.0

on:
  pull_request:
    branches:
      - chatgpt/pumpradar-v439-profit
    paths:
      - 'server-bootstrap/apply-v440.py'
      - 'server-bootstrap/build-v440.sh'
      - 'server-bootstrap/v440/TRIGGER'

permissions:
  contents: write

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pumpradar-v440-mc7-freeze100
          fetch-depth: 0
      - name: Build, test and publish v4.4.0
        run: bash server-bootstrap/build-v440.sh
