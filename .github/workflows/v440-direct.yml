name: Validate and publish PumpRadar v4.4.0

on:
  pull_request:
    branches:
      - chatgpt/pumpradar-v439-profit
    paths:
      - 'server-bootstrap/apply-v440.py'
      - 'server-bootstrap/build-v440.sh'
      - 'server-bootstrap/v440/TRIGGER'

permissions:
  contents: write

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/pumpradar-v440-mc7-freeze100
          fetch-depth: 1
          show-progress: false
      - name: Build, test and publish v4.4.0
        shell: bash
        run: |
          set +e
          bash server-bootstrap/build-v440.sh > /tmp/v440-build.log 2>&1
          code=$?
          tail -n 60 /tmp/v440-build.log
          exit "$code"
