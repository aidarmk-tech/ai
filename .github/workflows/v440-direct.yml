name: Validate and publish PumpRadar v4.4.0

on:
  push:
    branches:
      - chatgpt/pumpradar-v440-mc7-freeze100
    paths:
      - 'server-bootstrap/apply-v440.py'
      - 'server-bootstrap/build-v440.sh'
      - 'server-bootstrap/v440/TRIGGER'
      - '.github/workflows/v440-direct.yml'
  pull_request:
    branches:
      - chatgpt/pumpradar-v439-profit
    paths:
      - 'server-bootstrap/apply-v440.py'
      - 'server-bootstrap/build-v440.sh'
      - 'server-bootstrap/v440/TRIGGER'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/pumpradar-v440-mc7-freeze100
          fetch-depth: 0
      - name: Build, test and publish v4.4.0
        shell: bash
        run: bash server-bootstrap/build-v440.sh
